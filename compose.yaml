services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mneme
      POSTGRES_PASSWORD: mneme
      POSTGRES_DB: mneme
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mneme -d mneme"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MNEME_DSN: postgres://mneme:mneme@postgres:5432/mneme?sslmode=disable
      MNEME_PORT: "8080"
      MNEME_ENV: development
      MNEME_CORS_ORIGINS: http://localhost:5273,https://mneme.dev:8443
      MNEME_TLS_CERT: /app/.certs/mneme.dev.pem
      MNEME_TLS_KEY: /app/.certs/mneme.dev-key.pem
    ports:
      # https://mneme.dev:8443 → 127.0.0.1:8443 (mneme.dev resolves to
      # 127.0.0.1 via /etc/hosts; see `make setup-host`). Port 8443 keeps
      # clear of anything already on :443. Host is mneme.dev, NOT mneme.local:
      # macOS routes *.local through mDNS, which adds a ~5s resolver timeout
      # before falling back to /etc/hosts — see the deployment spec addendum.
      - "127.0.0.1:8443:8080"
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    healthcheck:
      # Server is TLS when the certs exist, plain HTTP before setup-host has
      # run — probe https first (no CA trust inside the container), fall back.
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8080/health || wget -qO- http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
