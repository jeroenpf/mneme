# GoReleaser config for mneme — reproducible, SPA-embedded, CGO-free macOS
# cross-build. Mirrors `make build-portable`: the before-hooks build the Vue SPA
# and copy it into internal/web/dist (which is //go:embed all:dist and holds only
# .gitkeep in git), then a single CGO_ENABLED=0 build produces darwin amd64+arm64
# archives + checksums.
#
# Local dry-run:  goreleaser release --snapshot --clean
# (Phase 2 appends a `brews:` block; Phase 3 adds the release workflow + tag.)
version: 2

before:
  hooks:
    - sh -c "cd web && npm ci && npm run build"
    - sh -c "rm -rf internal/web/dist && cp -r web/dist internal/web/dist && touch internal/web/dist/.gitkeep"

builds:
  - id: mneme
    main: ./cmd/mneme
    binary: mneme
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/jeroenpf/mneme/internal/cli.version={{ .Version }}
    goos: [darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
