root = "."
tmp_dir = ".tmp"

[build]
  cmd = "go build -o ./.tmp/mneme ./cmd/mneme"
  # Run the `server` subcommand: a bare `mneme` would just print help, so air
  # must invoke the service explicitly.
  bin = "./.tmp/mneme server"
  full_bin = "./.tmp/mneme server"
  include_ext = ["go", "sql"]
  exclude_dir = [".tmp", "web", ".git", ".architecture"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
